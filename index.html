<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>a blissful drive</title>
  <script>
    window.addEventListener('error', function(e) {
      var d = document.createElement('div');
      d.style.cssText = 'position:fixed;top:10px;left:10px;z-index:9999;background:red;color:white;padding:10px;pointer-events:none;font-family:sans-serif;';
      d.innerText = 'JS Error: ' + e.message + ' at line ' + e.lineno;
      document.body.appendChild(d);
    });
  </script>
  <link rel="stylesheet" href="styles.css?v=controls-4">
</head>
<body>
  <main id="app">
    <canvas id="scene" aria-label="Walkable 3D Bliss scene"></canvas>

    <aside id="tuning-panel" class="tuning-panel" aria-label="Scene tuning controls">
      <div class="tuning-panel__header">
        <strong>Scene Tuning</strong>
        <span id="export-status" aria-live="polite"></span>
      </div>

      <label>
        <span>Grass height</span>
        <input id="grass-height-control" type="range" min="0.55" max="1.8" step="0.01" value="0.55">
      </label>

      <label>
        <span>Grass base</span>
        <input id="grass-base-control" type="color" value="#161e0b">
      </label>

      <label>
        <span>Grass bright</span>
        <input id="grass-tip-a-control" type="color" value="#b2d83d">
      </label>

      <label>
        <span>Grass dark</span>
        <input id="grass-tip-b-control" type="color" value="#6f9b2d">
      </label>

      <label>
        <span>Ground green</span>
        <input id="terrain-color-control" type="color" value="#83b83d">
      </label>

      <label>
        <span>Sky colour</span>
        <input id="sky-color-control" type="color" value="#5fa6ff">
      </label>

      <label>
        <span>Fog colour</span>
        <input id="fog-color-control" type="color" value="#e0efff">
      </label>

      <label>
        <span>Fog density</span>
        <input id="fog-density-control" type="range" min="0" max="0.008" step="0.0001" value="0.0042">
      </label>

      <label>
        <span>Wind strength</span>
        <input id="wind-strength-control" type="range" min="0" max="2.4" step="0.01" value="1">
      </label>

      <label>
        <span>Show FPS</span>
        <input id="show-fps-control" type="checkbox">
      </label>

      <button id="export-settings" type="button">Export settings</button>
      <button id="save-spawn" type="button">Save spawn point</button>
      <textarea id="spawn-output" readonly aria-label="Saved spawn point JSON"></textarea>
      <textarea id="settings-output" readonly aria-label="Exported scene settings"></textarea>
    </aside>

    <div id="fps-meter" class="fps-meter" aria-live="off" aria-label="Frames per second">
      <span id="fps-value">-- FPS</span>
      <span class="fps-meter__track" aria-hidden="true">
        <span id="fps-bar" class="fps-meter__bar"></span>
      </span>
    </div>


    <button id="wallpaper-entry" class="wallpaper-screen" type="button" aria-label="Enter 3D Bliss scene">
      <img src="bliss.jpeg" alt="">
    </button>

    <div class="bottom-left-controls">
      <div class="attribution-container">
        <button id="attribution-btn" class="attribution-btn" aria-label="Show attribution">?</button>
        <div id="attribution-popup" class="attribution-popup">
          "Toyota Levin AE85 Grandfather" (<a href="https://skfb.ly/pEC9o" target="_blank" rel="noopener noreferrer">https://skfb.ly/pEC9o</a>) by GagoSahi is licensed under Creative Commons Attribution (<a href="http://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener noreferrer">http://creativecommons.org/licenses/by/4.0/</a>).<br><br>
          Three.js grass inspiration by <a href="https://github.com/thebenezer" target="_blank" rel="noopener noreferrer">thebenezer</a>.<br><br>
          Background music: reidenshi // november 8.
        </div>
      </div>

      <div class="volume-container">
        <button id="volume-btn" class="attribution-btn" aria-label="Adjust volume" aria-expanded="false">
          <svg id="volume-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="white" aria-hidden="true">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
          </svg>
        </button>
        <div id="volume-popup" class="volume-popup" role="dialog" aria-label="Volume control">
          <span class="volume-popup__label">Vol</span>
          <input id="volume-slider" class="volume-slider" type="range" min="0" max="1" step="0.01" value="0.6" aria-label="Music volume">
        </div>
      </div>

      <div class="settings-container">
        <button id="settings-btn" class="attribution-btn" aria-label="Toggle quality settings" aria-expanded="false">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="white" aria-hidden="true">
            <path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.01 7.01 0 0 0-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87a.48.48 0 0 0 .12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.37 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.57 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.48.48 0 0 0-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
          </svg>
        </button>
        <section id="quality-control" class="quality-control" aria-label="Graphics quality">
          <div class="quality-control__header">
            <span>Quality</span>
            <div class="quality-control__header-actions">
              <output id="quality-output">Medium · 3/5</output>
              <button id="tuning-toggle" class="quality-control__tuning-toggle" type="button" aria-expanded="false" aria-controls="tuning-panel" aria-label="Show scene tuning controls">
                <span aria-hidden="true"></span>
              </button>
            </div>
          </div>
          <div id="quality-slider-wrap" class="quality-slider" style="--quality-progress: 50%;">
            <span class="quality-slider__track" aria-hidden="true">
              <span class="quality-slider__fill"></span>
            </span>
            <input id="quality-slider-input" type="range" min="1" max="5" value="3" step="1" aria-label="Graphics quality, Medium 3 of 5">
            <span class="quality-slider__thumb" aria-hidden="true"></span>
          </div>
          <div id="quality-steps" class="quality-steps" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
        </section>
      </div>
    </div>

    <audio id="bgm" src="bgm.mp3" loop preload="auto"></audio>
  </main>

  <script src="vendor/three.min.js?v=0.150.1"></script>
  <script src="vendor/OBJLoader.js?v=2"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.module.js",
        "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.150.1/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="script.js?v=3d-scene-89"></script>
</body>
</html>
